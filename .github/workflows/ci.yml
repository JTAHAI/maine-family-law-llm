name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  hygiene-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Local doctor
        run: python scripts/doctor-local-repo.py --repo-root . --json
      - name: Install
        run: python -m pip install ".[api,dev]"
      - name: Remove package build artifacts
        run: python scripts/clean-local-artifacts.py --repo-root . --json
      - name: Public source pre-push gate
        run: python scripts/run-public-source-preflight.py --repo-root . --require-ready --output docs/external-evidence/public_source_pre_push_gate_ci.json
      - name: Offline dependency floor gate
        run: python scripts/check-dependency-security.py --strict-optional
      - name: Current advisory audit
        run: python -m pip_audit .
      - name: Quality-check command contract
        run: python -m py_compile scripts/run-quality-checks.py
      - name: Chat library evidence
        run: python scripts/run-chat-library-evidence.py --require-ready --output docs/external-evidence/chat_library_workbench_evidence_ci.json
      - name: Targeted tests
        run: >-
          python -m pytest -q
          tests/test_answering_pipeline_guardrails.py
          tests/test_canonical_document_model.py
          tests/test_retrieval_stack_pass5.py
          tests/test_matter_ingestion_pass9.py
          tests/test_chat_library_v187_input_clear_and_routing.py
          tests/test_filing_ready_gate.py
          tests/test_filing_ready_endpoint.py
          tests/test_trusted_filing_review.py
          tests/test_v5140_reviewed_filing_packet.py
          tests/test_official_fetch_transport.py
          tests/test_official_ingest_pipeline.py
          tests/test_isolated_release_regression.py
          tests/test_pass48_51_launch_evidence_gates.py
          tests/test_pass48_51_launch_evidence_starter_kit.py
          tests/test_enterprise_release_control_v206.py
          tests/test_pass50_pass51_ga_release.py
          tests/test_attorney_sandbox_review_kit_v193.py
          tests/test_public_source_pre_push_gate_v191.py
          tests/test_git_safe_push_v192.py
          tests/test_qwen_task_specialization.py
          tests/test_v510_dependency_security.py
          tests/test_v510_workflow_skill_registry.py
          tests/test_v510_matter_inventory_and_classification.py
          tests/test_v510_cross_document_consistency.py
          tests/test_v510_independent_qc_contract.py
          tests/test_v510_knowledge_bundle.py
          tests/test_v510_docx_media_and_skill_package.py
          tests/test_v510_ingestion_integration.py

  full-release-regression:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-regression')
    needs: hygiene-and-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolate runtime profile and dependencies
        run: |
          $scratch = New-Item -ItemType Directory -Force dist/ci/runtime
          "TEMP=$($scratch.FullName)" >> $env:GITHUB_ENV
          "TMP=$($scratch.FullName)" >> $env:GITHUB_ENV
          "TMPDIR=$($scratch.FullName)" >> $env:GITHUB_ENV
          "LOCALAPPDATA=$($scratch.FullName)" >> $env:GITHUB_ENV
          "APPDATA=$($scratch.FullName)" >> $env:GITHUB_ENV
          "PYTHONDONTWRITEBYTECODE=1" >> $env:GITHUB_ENV
      - name: Install application and test dependencies
        run: |
          python -m venv dist/ci/runtime-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = if ($IsWindows) { "Scripts" } else { "bin" }
          $python = (Join-Path $PWD "dist/ci/runtime-venv/$bin/python")
          if ($IsWindows) { $python += ".exe" }
          "MFL_CI_TEST_PYTHON=$python" >> $env:GITHUB_ENV
          & $python -m pip install "torch>=2.5,<3" --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install ".[api,dev,release-hardening,fast-interchange]" "fpdf2>=2.8.0,<3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
      - name: Provision headless desktop test display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sudo apt-get install -y xvfb xauth
      - name: Run complete collected suite with bounded batches
        run: |
          $regressionArgs = @('-B', 'scripts/run_isolated_release_regression.py', '--snapshot-source', '--output', 'dist/ci/regression', '--collection-timeout', '600', '--batch-timeout', '1800')
          if ($IsLinux) { xvfb-run -a $env:MFL_CI_TEST_PYTHON @regressionArgs }
          else { & $env:MFL_CI_TEST_PYTHON @regressionArgs }
          exit $LASTEXITCODE
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/ci/regression/*.log
            dist/ci/regression/*.json
            dist/ci/regression/*.xml
