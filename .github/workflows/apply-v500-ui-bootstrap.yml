name: Apply v5.0.0 UX release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-v500-ui-release
  cancel-in-progress: false

jobs:
  apply-release:
    if: ${{ github.repository == 'JTAHAI/maine-family-law-llm' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          test -d .github/bootstrap/v500xz
          cat .github/bootstrap/v500xz/part-* > /tmp/v500.patch.xz.b64
          printf '%s  %s\n' '27e791b3f714d9ee854d499a0ba75a6ced053d3e293a915c97c6fcbb668e8851' /tmp/v500.patch.xz.b64 | sha256sum -c -
          base64 --decode /tmp/v500.patch.xz.b64 | xz --decompress > /tmp/v500.patch
          printf '%s  %s\n' 'fdacaf3e3f504b5ee05989ea9347bd8fbda3345ba882f70747d0225ab1b0a202' /tmp/v500.patch | sha256sum -c -
          git apply --check /tmp/v500.patch
          git apply /tmp/v500.patch
          rm -rf .github/bootstrap/v500 .github/bootstrap/v500xz
          rm -f .github/workflows/apply-v500-ui-bootstrap.yml

      - name: Commit v5.0.0 release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Justin Tahai'
          git config user.email 'justintahai@gmail.com'
          git add -A
          git commit -m 'release: publish v5.0.0 premium workbench UX hardening'
          git push origin HEAD:main
