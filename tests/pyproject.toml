[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maine-family-law-llm"
version = "1.28.0"
description = "Standalone Maine family law legal AI with post-GA enterprise hardening, local preflight, resource collection, public-release readiness, attribution kit, supply-chain evidence, release lockfiles, final acceptance checks, and local test-readiness certification, reboot-safe recovery health checks, operator test battery, and packaged public CI hygiene plus production promotion gate locking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pypdf>=4.3"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.28"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.28"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "legal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning"
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  "runtime",
  "uploads",
  "vectorstores",
  "corpora",
  "node_modules",
  "dist",
  ".venv",
  "*.egg-info",
  ".eggs"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
