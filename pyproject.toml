[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maine-family-law-llm"
version = "1.89.0"
description = "Standalone Maine family law legal AI with source-backed local chat workbench v1.88 repo-hygiene recovery, packaged GitHub metadata, missing model stubs restored for enterprise test collection, and preserved v1.87 chat routing/input-clear behavior"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pypdf>=4.3"]

[project.scripts]
mfl = "maine_family_law_llm.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.28"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.28"]

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["app*", "legal*", "maine_family_law_llm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning"
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  "runtime",
  "uploads",
  "vectorstores",
  "corpora",
  "node_modules",
  "dist",
  ".venv",
  "*.egg-info",
  ".eggs"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
