name: Bug report
about: Report a source-code or local-test problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste confidential matter facts, sealed records, private client data, credentials, or downloaded legal corpora.
  - type: input
    id: version
    attributes:
      label: Repo version or ZIP name
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what failed and what command you ran.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Safe logs
      description: Paste sanitized output only. Remove names, docket numbers, addresses, secrets, and private facts.
      render: shell
    validations:
      required: false
